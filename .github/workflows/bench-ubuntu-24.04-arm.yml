# Generated by `cargo run -p ci-bench -- workflows --write` from fixtures.toml: do not edit.
# The four bench-*.yml workflows are identical but for the runner (`runs-on` and the name).
name: "bench: ubuntu-24.04-arm"
run-name: "${{ inputs.fixture }} ${{ inputs.scenario }} ${{ inputs.tag }}"

on:
  workflow_dispatch:
    inputs:
      fixture:
        description: The fixture under fixtures/
        required: true
        type: choice
        default: rust-small
        options:
          - rust-small
          - rust-large
          - go-small
          - go-large
          - node-small
          - node-large
          - python-small
          - python-large
      scenario:
        description: The scenario the branch's commit applies (scenarios.toml), a label
        required: true
        type: string
        default: baseline
      tag:
        description: The driver's id for this run
        required: true
        type: string
        default: manual

permissions:
  contents: read

jobs:
  bench:
    name: bench
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: fixtures/${{ inputs.fixture }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: fixtures/${{ inputs.fixture }}
          persist-credentials: false
      - name: "toolchain: rust"
        if: inputs.fixture == 'rust-small' || inputs.fixture == 'rust-large'
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update && rustup default 1.97.1
      - name: "toolchain: rust cache"
        if: inputs.fixture == 'rust-small' || inputs.fixture == 'rust-large'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fixtures/${{ inputs.fixture }}
          shared-key: ${{ inputs.fixture }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: "toolchain: go"
        if: inputs.fixture == 'go-small' || inputs.fixture == 'go-large'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: fixtures/${{ inputs.fixture }}/go.*
      - name: "toolchain: pnpm"
        if: inputs.fixture == 'node-small' || inputs.fixture == 'node-large'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: fixtures/${{ inputs.fixture }}/package.json
      - name: "toolchain: node"
        if: inputs.fixture == 'node-small' || inputs.fixture == 'node-large'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: fixtures/${{ inputs.fixture }}/pnpm-lock.yaml
      - name: "toolchain: uv"
        if: inputs.fixture == 'python-small'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: fixtures/${{ inputs.fixture }}/uv.lock
      - name: "toolchain: python"
        if: inputs.fixture == 'python-large'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: fixtures/${{ inputs.fixture }}/pyproject.toml
      - name: install
        env:
          FIXTURE: ${{ inputs.fixture }}
        run: |
          case "$FIXTURE" in
            rust-small) cargo test --no-run ;;
            rust-large) cargo test --workspace --locked --no-run ;;
            go-small) go mod download && go test -run '^$' ./... ;;
            go-large) go mod download && go test -run '^$' ./... ;;
            node-small) pnpm install --frozen-lockfile ;;
            node-large) pnpm install --frozen-lockfile ;;
            python-small) uv sync --locked --group tests ;;
            python-large) python -m pip install -e . tblib ;;
            *) echo "unknown fixture $FIXTURE" >&2; exit 2 ;;
          esac
      - name: test
        env:
          FIXTURE: ${{ inputs.fixture }}
        run: |
          case "$FIXTURE" in
            rust-small) cargo test ;;
            rust-large) cargo test --workspace --locked ;;
            go-small) go test ./... ;;
            go-large) go test ./... ;;
            node-small) pnpm exec vitest run ;;
            node-large) pnpm exec vitest run --project unit ;;
            python-small) uv run --locked --group tests pytest ;;
            python-large) python tests/runtests.py --parallel ;;
            *) echo "unknown fixture $FIXTURE" >&2; exit 2 ;;
          esac
