adv_auto_import = '''export const sharedPlugins = [
  {
    // Auto-imports useCounter into the tests that call it without importing it.
    name: 'ci-bench:auto-import',
    enforce: 'pre' as const,
    transform(code: string, id: string) {
      if (!id.endsWith('.test.ts') || !code.includes('useCounter(') || code.includes('import { useCounter }')) {
        return null
      }
      return `import { useCounter } from '/src/composables/useCounter.ts'\n${code}`
    },
  },
]'''
