# Scripted agent diffs. Each scenario of a fixture is a list of edits applied to the pristine
# fixture (paths relative to fixtures/<fixture>); the driver commits them on a throwaway branch
# and every runner tests that branch. Every scenario keeps the suite passing. `baseline` (no
# edits) is implicit: the fixture as vendored.
#
# Classes (every fixture has each one):
#   leaf       code few modules depend on       mid_graph  code many modules depend on
#   trigger    a manifest or tool config file   test_only  an existing test file
#   docs_only  documentation only               add        a new test file
#   delete     a test or example file removed   rename     a test file renamed
#
# Edits (exactly one of `append`, `create`, `delete`, `rename`, `replace` per edit):
#   { append = "path", snippet = "name" }           the snippet added at the end of a file
#   { create = "path", snippet = "name" }           a new file holding the snippet
#   { delete = "path" }                             a file removed
#   { rename = "from", to = "to" }                  a file moved, content unchanged
#   { replace = "path", find = "text", snippet = "name" }  the one occurrence of `find` replaced
# Snippets are below; a file is read and written as UTF-8 bytes, nothing else changes.

[snippets]
rust_fn = "\n#[allow(dead_code)]\nfn ci_bench_edit() -> u32 {\n    1\n}\n"
rust_test = "\n#[test]\nfn ci_bench_test_only() {\n    assert_eq!(1 + 1, 2);\n}\n"
rust_added = "#[test]\nfn ci_bench_added() {\n    assert_eq!(1 + 1, 2);\n}\n"
cargo_meta = "\n[package.metadata.ci-bench]\nscenario = \"trigger\"\n"
go_fn = "\nfunc ciBenchEdit() int {\n\treturn 1\n}\n"
go_test = "\nfunc TestCiBenchTestOnly(t *testing.T) {\n\tif 1+1 != 2 {\n\t\tt.Fatal(\"arithmetic\")\n\t}\n}\n"
go_added_uuid = "package uuid\n\nimport \"testing\"\n\nfunc TestCiBenchAdded(t *testing.T) {\n\tif 1+1 != 2 {\n\t\tt.Fatal(\"arithmetic\")\n\t}\n}\n"
go_added_gin = "package gin\n\nimport \"testing\"\n\nfunc TestCiBenchAdded(t *testing.T) {\n\tif 1+1 != 2 {\n\t\tt.Fatal(\"arithmetic\")\n\t}\n}\n"
go_mod_comment = "\n// ci-bench: trigger\n"
ts_fn = "\nfunction ciBenchEdit(): number {\n  return 1\n}\n"
ts_comment = "\n// ci-bench: trigger\n"
vitest_test = "\nit('ci-bench test-only', () => {\n  expect(1 + 1).toBe(2)\n})\n"
vitest_added = "import { expect, it } from 'vitest'\n\nit('ci-bench added', () => {\n  expect(1 + 1).toBe(2)\n})\n"
package_json_field = "\"version\": \"6.1.7\",\n  \"ciBench\": \"trigger\","
py_fn = "\n\ndef _ci_bench_edit():\n    return 1\n"
pytest_test = "\n\ndef test_ci_bench_test_only():\n    assert 1 + 1 == 2\n"
pytest_added = "def test_ci_bench_added():\n    assert 1 + 1 == 2\n"
django_test = "\n\nclass CiBenchTestOnlyTests(SimpleTestCase):\n    def test_ci_bench_test_only(self):\n        self.assertEqual(1 + 1, 2)\n"
django_added = "from django.test import SimpleTestCase\n\n\nclass CiBenchAddedTests(SimpleTestCase):\n    def test_ci_bench_added(self):\n        self.assertEqual(1 + 1, 2)\n"
pyproject_tool = "\n[tool.ci-bench]\nscenario = \"trigger\"\n"
docs_line = "\nci-bench: a documentation-only edit.\n"

