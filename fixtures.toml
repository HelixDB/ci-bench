# The benchmark fixtures: snapshots of permissively licensed open-source projects at a pinned
# commit, vendored under fixtures/<name> without their .git and .github directories (each keeps
# its upstream license file). Every runner runs the same two commands with bash in
# fixtures/<name>: `install` (dependencies and the build, warm from the ecosystem's cache) and
# `test`. `toolchain` picks the setup and cache steps of the workflows.
#
# `ci-bench validate` checks this file against fixtures/; `ci-bench workflows --write` renders
# .github/workflows from it.

[[fixture]]
name = "rust-small"
toolchain = "rust"
upstream = "https://github.com/dtolnay/semver"
tag = "1.0.28"
commit = "7625c7aa3f0e8ba21e099d1765bcebcb72aa8816"
license = "MIT OR Apache-2.0"
install = "cargo test --no-run"
test = "cargo nextest run && cargo test --doc"

[[fixture]]
name = "rust-large"
toolchain = "rust"
upstream = "https://github.com/BurntSushi/ripgrep"
tag = "15.2.0"
commit = "e89fff89ac9af12e8d4ce9d5fd07beb408ca730f"
license = "Unlicense OR MIT"
install = "cargo test --workspace --locked --no-run"
test = "cargo nextest run --workspace --locked && cargo test --workspace --locked --doc"

[[fixture]]
name = "go-small"
